name: Build Wear App

# `:wearApp` is a separate module with no flavors, so the root `assemble<Variant>Release`
# invocations in build.yml never reach it. This job builds the watch APK on its own and uploads it
# as an artifact; install it with `adb install -r` next to the matching phone build.

on:
  workflow_dispatch:
    inputs:
      applicationId:
        description: "Must match the phone build, or the Data Layer bridge will not pair"
        required: false
        default: "com.meld.app"
      appName:
        description: "Label shown on the watch"
        required: false
        default: "Meld"
  push:
    branches: ["**"]
    paths:
      - "wearApp/**"
      - "wearbridge/**"
      - "app/src/main/kotlin/com/metrolist/music/wear/**"
      - "app/src/main/AndroidManifest.xml"
      - "gradle/libs.versions.toml"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build_wear.yml"

permissions:
  contents: write

jobs:
  build_wear:
    name: Build watch debug APK
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Init metroproto submodule
        run: git submodule update --init metroproto

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY }}
          cache-cleanup: on-success

      - name: Setup and Generate Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build wear debug APK
        run: ./gradlew --console=plain :wearApp:assembleDebug --warning-mode summary -x lint
        env:
          # Both overrides must match the phone build: the Data Layer API only pairs apps whose
          # applicationId is identical.
          METROLIST_APPLICATION_ID: ${{ github.event.inputs.applicationId || 'com.meld.app' }}
          METROLIST_APP_NAME: ${{ github.event.inputs.appName || 'Meld Nightly' }}
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Upload wear APK
        uses: actions/upload-artifact@v6
        with:
          name: meld-wear-debug
          path: wearApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
