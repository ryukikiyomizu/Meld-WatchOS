name: Build Wear App

# `:wearApp` is a separate module with no flavors, so the root `assemble<Variant>Release`
# invocations in build.yml never reach it. This job builds the watch APK on its own and uploads it
# as an artifact; install it with `adb install -r` next to the matching phone build.

on:
  workflow_dispatch:
    inputs:
      applicationId:
        description: "Must match the phone build, or the Data Layer bridge will not pair"
        required: false
        default: "com.meld.app"
      appName:
        description: "Label shown on the watch"
        required: false
        default: "Meld"
  push:
    branches: ["**"]
    paths:
      - "wearApp/**"
      - "wearbridge/**"
      - "app/src/main/kotlin/com/metrolist/music/wear/**"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/main/kotlin/com/metrolist/music/constants/MediaSessionConstants.kt"
      - "app/src/main/kotlin/com/metrolist/music/playback/MediaLibrarySessionCallback.kt"
      - "gradle/libs.versions.toml"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build_wear.yml"

permissions:
  contents: write

jobs:
  build_wear:
    name: Build watch debug APK
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Init metroproto submodule
        run: git submodule update --init metroproto

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY }}
          cache-cleanup: on-success

      - name: Setup and Generate Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build wear debug APK
        # The phone half is compiled here too: it only has to agree with the watch on the wire, so
        # one job that reports both error sets beats reading two workflows' logs.
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --console=plain :wearApp:assembleDebug :app:compileFossDebugKotlin \
            --warning-mode summary -x lint 2>&1 | tee "$RUNNER_TEMP/build.log"
        env:
          # Both overrides must match the phone build: the Data Layer API only pairs apps whose
          # applicationId is identical.
          METROLIST_APPLICATION_ID: ${{ github.event.inputs.applicationId || 'com.meld.app' }}
          METROLIST_APP_NAME: ${{ github.event.inputs.appName || 'Meld Nightly' }}
          PULL_REQUEST: "false"
          GITHUB_EVENT_NAME: ${{ github.event_name }}

      - name: Surface compile errors
        # The raw job log lives on blob storage which a headless run cannot fetch, so the compiler
        # output is mirrored into the step summary and into check-run annotations. Both are served
        # by github.com and show up on the run page.
        if: failure()
        shell: bash
        run: |
          log="$RUNNER_TEMP/build.log"
          if [ ! -f "$log" ]; then
            echo '::error::Gradle wrote no log; the build step died before starting.'
            exit 0
          fi
          echo '### Build log tail' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          grep -E "^e: |^> Task .*FAILED|FAILURE:|What went wrong|Caused by:|^w: .*unresolved" "$log" \
            | head -n 200 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          while IFS= read -r line; do
            printf '::error::%s\n' "${line#e: }"
          done < <(grep -E "^e: " "$log" | head -n 40)
          while IFS= read -r line; do
            printf '::error::%s\n' "$line"
          done < <(grep -E -A3 "What went wrong" "$log" | grep -v '^--$' | head -n 16)

      - name: Upload wear APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: meld-wear-debug
          path: wearApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
