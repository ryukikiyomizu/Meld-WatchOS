name: Build Wear App

# `:wearApp` is a separate module with no flavors, so the root `assemble<Variant>Release`
# invocations in build.yml never reach it. This job builds the watch APK and the matching foss debug
# phone APK (the bridge lives on the phone side, so the two have to come from one build) and uploads
# both as artifacts.

on:
  workflow_dispatch:
    inputs:
      applicationId:
        description: "Must match the phone build, or the Data Layer bridge will not pair"
        required: false
        default: "com.meld.app"
      appName:
        description: "Label shown on the watch"
        required: false
        default: "Meld"
  push:
    branches: ["**"]
    paths:
      - "wearApp/**"
      - "wearbridge/**"
      - "app/src/main/kotlin/com/metrolist/music/wear/**"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/main/kotlin/com/metrolist/music/constants/MediaSessionConstants.kt"
      - "app/src/main/kotlin/com/metrolist/music/playback/MediaLibrarySessionCallback.kt"
      - "gradle/libs.versions.toml"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/build_wear.yml"

permissions:
  contents: write

jobs:
  build_wear:
    name: Build watch debug APK
    if: github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]'
    runs-on: ubuntu-latest

    env:
      # Both overrides must match the phone build: the Data Layer API only pairs apps whose
      # applicationId is identical.
      METROLIST_APPLICATION_ID: ${{ github.event.inputs.applicationId || 'com.meld.app' }}
      METROLIST_APP_NAME: ${{ github.event.inputs.appName || 'Meld Nightly' }}
      PULL_REQUEST: "false"
      GITHUB_EVENT_NAME: ${{ github.event_name }}

    steps:
      - uses: actions/checkout@v6

      - name: Init metroproto submodule
        run: git submodule update --init metroproto

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_CACHE_KEY }}
          cache-cleanup: on-success

      - name: Setup and Generate Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build wear debug APK
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --console=plain :wearApp:assembleDebug --warning-mode summary \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      # Uploaded before anything else can fail, so the APK is on the run page whenever it exists.
      - name: Upload wear APK
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: meld-wear-debug
          path: wearApp/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      # One debug key shared with `build.yml`'s debug job (same cache path and key), so every CI
      # artifact — watch or phone — carries the same signature and updates in place. `:app` prefers
      # app/persistent-debug.keystore over the generated Android debug key as soon as it exists.
      - name: Restore Persistent Keystore
        id: debug_keystore
        uses: actions/cache/restore@v4
        with:
          path: app/persistent-debug.keystore
          key: meld-debug-keystore-v1

      - name: Create the persistent debug keystore
        if: steps.debug_keystore.outputs.cache-hit != 'true'
        shell: bash
        run: |
          keystore=app/persistent-debug.keystore
          keytool -genkeypair -v \
            -keystore "$keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10950 \
            -dname "CN=Meld Debug,O=Meld,C=US"

      - name: Save Persistent Keystore
        if: always() && steps.debug_keystore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: app/persistent-debug.keystore
          key: meld-debug-keystore-v1

      - name: Assemble the phone debug APK
        # The watch only works next to a phone app built from this same code (it carries the bridge),
        # so this produces that APK too instead of merely type-checking the module. A failure here is
        # reported, but the watch artifact is already uploaded, so it never hides a good watch build.
        if: always()
        shell: bash
        run: |
          set -o pipefail
          ./gradlew --console=plain :app:assembleFossDebug --warning-mode summary \
            2>&1 | tee -a "$RUNNER_TEMP/build.log"

      - name: Upload phone APK
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: meld-phone-foss-debug
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Surface compile errors
        # The raw job log lives on blob storage that CI tooling cannot reach, so the compiler output
        # is mirrored into check-run annotations and onto the commit as a comment: both are plain
        # github.com API surfaces. This step never fails, whatever it finds.
        if: failure()
        shell: bash
        run: |
          log="${RUNNER_TEMP:-.}/build.log"
          out="${GITHUB_STEP_SUMMARY:-/dev/null}"
          {
            echo '### Build log, errors only'
            echo '```text'
            grep -E "^e: |^> Task .*FAILED|^FAILURE:|What went wrong|Caused by:" "$log" 2>/dev/null \
              | awk 'NR<=400'
            echo '```'
          } >>"$out" 2>/dev/null
          grep -E "^e: " "$log" 2>/dev/null | awk 'NR<=60' | while IFS= read -r line; do
            printf '::error::%s\n' "${line#e: }"
          done
          exit 0

      - name: Publish errors as commit comment
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          log="${RUNNER_TEMP:-.}/build.log"
          body=$(
            {
              echo "### ${GITHUB_WORKFLOW:-Build Wear App} errors for commit ${GITHUB_SHA:0:7}"
              echo
              echo '```text'
              grep -E "^e: |^> Task .*FAILED|^FAILURE:|What went wrong|Caused by:" "$log" 2>/dev/null \
                | awk 'NR<=450'
              echo '```'
            } | head -c 60000
          )
          if [ -z "$body" ]; then
            body='Build failed with no parsable Gradle output (log missing or empty).'
          fi
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            -f body="$body" || echo "could not post the commit comment"
          exit 0
