name: Generate Baseline Profile

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    name: Generate baseline profile (fossPreview)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6

      - name: Init metroproto submodule
        run: git submodule update --init metroproto

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: on-success

      - name: Setup and Generate Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Install AOSP ATD system image for profile generation
        run: |
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses || true
          "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager "system-images;android-33;aosp_atd;x86_64"

      - name: Generate baseline profile
        run: |
          ./gradlew --console=plain :app:generateFossPreviewBaselineProfile \
            -Pandroid.testoptions.manageddevices.emulator.gpu="swiftshader_indirect" \
            --stacktrace

      - name: Show generated profile
        run: |
          find app/src -name "baseline-prof.txt" -o -name "*.-prof" | xargs ls -la || true
          head -c 2000 "$(find app/src -name 'baseline-prof.txt' | head -1)" || true

      - name: Upload generated profile
        uses: actions/upload-artifact@v4
        with:
          name: baseline-profile
          path: |
            app/src/**/baselineProfiles/**
