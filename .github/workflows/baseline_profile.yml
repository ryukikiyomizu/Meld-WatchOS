name: Generate Baseline Profile

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a09e33-meld-watchos
    paths:
      - .github/workflows/baseline_profile.yml

permissions:
  contents: read

jobs:
  generate:
    name: Generate baseline profile (fossPreview)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v6

      - name: Init metroproto submodule
        run: git submodule update --init metroproto

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: on-success

      - name: Setup and Generate Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install emulator + AOSP ATD image
        run: |
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager "system-images;android-33;aosp_atd;x86_64" "platform-tools" "emulator"

      - name: Create and boot AVD
        run: |
          echo "no" | "$ANDROID_HOME"/cmdline-tools/latest/bin/avdmanager create avd -n bp -k "system-images;android-33;aosp_atd;x86_64" -d pixel_6 --force
          "$ANDROID_HOME"/emulator/emulator -avd bp -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot > /tmp/emu.log 2>&1 &
          adb wait-for-device
          ok=0
          i=0
          while [ $i -lt 60 ]; do
            b=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
            if [ "$b" = "1" ]; then ok=1; break; fi
            i=$((i+1))
            sleep 10
          done
          if [ "$ok" != "1" ]; then
            tail -n 30 /tmp/emu.log | tr -d '\r' | sed 's/^/::error::/'
            exit 1
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          echo "AVD booted"

      - name: Generate baseline profile
        run: |
          ./gradlew --console=plain :app:generateFossPreviewBaselineProfile --stacktrace > /tmp/bp.log 2>&1
          rc=$?
          tail -n 60 /tmp/bp.log
          if [ "$rc" != "0" ]; then
            grep -aE "Caused by|What went wrong|FAILED|error" /tmp/bp.log | head -15 | tr -d '\r' | sed 's/^/::error::/'
            exit "$rc"
          fi

      - name: Show generated profile
        run: |
          find app/src -name "baseline-prof.txt" -o -name "*.-prof" | xargs ls -la || true
          head -c 2000 "$(find app/src -name 'baseline-prof.txt' | head -1)" || true

      - name: Upload generated profile
        uses: actions/upload-artifact@v4
        with:
          name: baseline-profile
          path: |
            app/src/**/baselineProfiles/**
