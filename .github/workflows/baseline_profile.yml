name: Generate Baseline Profile

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a09e33-meld-watchos
    paths:
      - .github/workflows/baseline_profile.yml

permissions:
  contents: read

jobs:
  generate:
    name: Generate baseline profile (fossPreview)
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v6

      - name: Init metroproto submodule
        run: git submodule update --init metroproto

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: on-success

      - name: Setup and Generate Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Report KVM availability
        run: ls -la /dev/kvm || echo "::warning::no /dev/kvm on this runner"

      - name: Generate baseline profile on an emulator
        uses: reactivecircus/android-emulator-runner@v2.32.0
        with:
          api-level: 33
          target: aosp_atd
          arch: x86_64
          cores: 4
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot
          script: |
            adb wait-for-device
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0
            ./gradlew --console=plain :app:generateFossPreviewBaselineProfile --stacktrace > /tmp/bp.log 2>&1
            cp /tmp/bp.log bp.log
        continue-on-error: true

      - name: Check generation result
        run: |
          if grep -q "BUILD SUCCESSFUL" bp.log; then
            echo "generation ok"
          else
            echo "::error::$(grep -aE 'What went wrong|Caused by|FAILED' bp.log | head -8 | tr -d '\r' | tr '\n' '|')"
            echo "::error::$(tail -c 900 bp.log | tr -d '\r' | tr '\n' '|')"
            exit 1
          fi

      - name: Show generated profile
        run: |
          find app/src -name "baseline-prof.txt" -o -name "*.-prof" | xargs ls -la || true
          head -c 2000 "$(find app/src -name 'baseline-prof.txt' | head -1)" || true

      - name: Upload generated profile
        uses: actions/upload-artifact@v4
        with:
          name: baseline-profile
          path: |
            app/src/**/baselineProfiles/**
