name: Generate Baseline Profile

on:
  workflow_dispatch:
  push:
    branches:
      - arena/01a09e33-meld-watchos
    paths:
      - .github/workflows/baseline_profile.yml

permissions:
  contents: read

jobs:
  generate:
    name: Generate baseline profile (${{ matrix.leg }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        leg: [a, b]

    steps:
      - uses: actions/checkout@v6

      - name: Init metroproto submodule
        run: git submodule update --init metroproto

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set Up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-cleanup: on-success

      - name: Setup and Generate Protobuf
        uses: ./.github/actions/setup-protobuf

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [ -e /dev/kvm ]; then echo "KVM present"; else echo "::error::NO /dev/kvm on this runner"; fi

      - name: Install emulator + AOSP ATD image
        run: |
          yes | "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME"/cmdline-tools/latest/bin/sdkmanager "system-images;android-33;aosp_atd;x86_64" "platform-tools" "emulator"

      - name: Boot AVD (up to 3 attempts)
        run: |
          AVDMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager"
          EMULATOR="$ANDROID_HOME/emulator/emulator"
          booted=0
          attempt=1
          while [ "$attempt" -le 3 ]; do
            echo "=== boot attempt $attempt ==="
            pkill -f "qemu-system" > /dev/null 2>&1 || true
            sleep 3
            adb kill-server > /dev/null 2>&1 || true
            adb start-server > /dev/null 2>&1 || true
            rm -rf "$HOME/.android/avd/bp.avd" "$HOME/.android/avd/bp.ini"
            if [ "${{ matrix.leg }}" = "a" ]; then
              yes no | "$AVDMANAGER" create avd -n bp -k "system-images;android-33;aosp_atd;x86_64" -d pixel_6 --force > "/tmp/avd$attempt.log" 2>&1 || true
            else
              yes no | "$AVDMANAGER" create avd -n bp -k "system-images;android-33;aosp_atd;x86_64" --force > "/tmp/avd$attempt.log" 2>&1 || true
            fi
            if [ ! -f "$HOME/.android/avd/bp.ini" ]; then
              echo "::error::AVD-CREATE failed: $(tail -c 600 /tmp/avd$attempt.log | tr -d '\r' | tr '\n' '|')"
              echo "::error::AVD-DIR: $(ls -la "$HOME/.android/avd" 2>/dev/null | tr '\n' '|')"
            fi
            "$EMULATOR" -avd bp -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot > "/tmp/emu$attempt.log" 2>&1 &
            EMUPID=$!
            timeout 240 adb wait-for-device || echo "wait-for-device timed out"
            ok=0
            i=0
            while [ "$i" -lt 60 ]; do
              b=$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')
              if [ "$b" = "1" ]; then ok=1; break; fi
              if ! kill -0 "$EMUPID" > /dev/null 2>&1; then echo "emulator process died"; break; fi
              i=$((i+1))
              sleep 10
            done
            if [ "$ok" = "1" ]; then
              booted=1
              break
            fi
            kill "$EMUPID" > /dev/null 2>&1 || true
            attempt=$((attempt+1))
          done
          if [ "$booted" != "1" ]; then
            echo "::error::AVD failed to boot after 3 attempts"
            echo "::error::EMU-LOG: $(tail -c 800 /tmp/emu3.log 2>/dev/null | tr -d '\r' | tr '\n' '|')"
            exit 1
          fi
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          echo "AVD booted"

      - name: Generate baseline profile
        run: |
          ./gradlew --console=plain :app:generateFossPreviewBaselineProfile --stacktrace > /tmp/bp.log 2>&1 || true
          cp /tmp/bp.log bp.log
          if grep -q "BUILD SUCCESSFUL" bp.log; then
            echo "generation ok"
          else
            echo "::error::$(grep -aE 'What went wrong|Caused by|FAILED' bp.log | head -6 | tr -d '\r' | tr '\n' '|')"
            echo "::error::$(tail -c 900 bp.log | tr -d '\r' | tr '\n' '|')"
            exit 1
          fi

      - name: Upload generated profile
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-profile-${{ matrix.leg }}
          path: |
            app/src/**/baselineProfiles/**
            app/src/**/baseline-prof.txt

  result:
    name: Baseline profile generated
    needs: generate
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download any generated profile
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: baseline-profile-*
          merge-multiple: true
          path: out

      - name: Require a profile
        run: |
          find out -type f | head -20
          if find out -name "baseline-prof.txt" -o -name "*.txt" | grep -q .; then
            echo "profile produced"
            find out -type f -exec wc -c {} +
          else
            echo "::error::no baseline profile was generated on any leg"
            exit 1
          fi

      - name: Upload merged profile
        uses: actions/upload-artifact@v4
        with:
          name: baseline-profile
          path: out/
